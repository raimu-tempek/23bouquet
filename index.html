<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-web.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>23Bouquet | Custom Bouquet</title>
    <meta name="description" content="Buat buket bunga custom sesuai keinginanmu di 23Bouquet. Pilih bunga, warna, dan wrapping untuk menciptakan buket personal yang awet dan penuh makna." />

    <!-- Open Graph / preview link (WhatsApp, IG, Facebook, X, LinkedIn) -->
    <!-- CATATAN PRODUCTION: og:image & twitter:image di bawah masih path RELATIVE (/thumbnail.png)
         yang hanya valid untuk preview di browser lokal. Platform social (khususnya WhatsApp
         & Facebook) TIDAK bisa resolve path relatif & HANYA menerima URL absolut, jadi saat
         sudah live path ini WAJIB diganti menjadi absolute URL, contoh:
           content="https://domain-asli.com/thumbnail.png"
         OG guidelines: og:image idealnya 1200x630 px (rasio 1.91:1) & di bawah 5 MB.
         File src/thumbnail.png saat ini 2400x1260 px (1,0 MB) - rasio sudah sesuai, hanya dimensions
         dan ukuran file-nya lebih besar dari anjuran. -->
    <meta property="og:title" content="23Bouquet | Custom Bouquet" />
    <meta property="og:description" content="Buat buket bunga custom sesuai keinginanmu di 23Bouquet. Pilih bunga, warna, dan wrapping untuk menciptakan buket personal yang awet dan penuh makna." />
    <meta property="og:image" content="/thumbnail.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="23Bouquet | Custom Bouquet" />
    <meta name="twitter:description" content="Buat buket bunga custom sesuai keinginanmu di 23Bouquet. Pilih bunga, warna, dan wrapping untuk menciptakan buket personal yang awet dan penuh makna." />
    <meta name="twitter:image" content="/thumbnail.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased text-gray-900 bg-white selection:bg-pink-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
